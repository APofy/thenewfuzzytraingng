    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OsobnyStrazca_iOS
    info:
      path: OsobnyStrazca-Info.plist
      properties:
        CFBundleDisplayName: Osobný Strážca
        NSBluetoothAlwaysUsageDescription: "Bluetooth sa používa na spojenie so zariadením Osobný Strážca."
